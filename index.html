<title>SNAKE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root {
    --ground: #070c08;
    --panel: #0d140e;
    --line: #16241a;
    --snake: #3ddc5a;
    --snake-dim: #2aa946;
    --food: #a8ff60;
    --text: #cfeed6;
    --dim: #5c7a62;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .game {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: stretch;
    padding: 16px;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .hud .title { color: var(--snake); font-weight: 700; }
  .hud .scores { display: flex; gap: 22px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .hud .scores b { color: var(--text); font-weight: 700; margin-left: 6px; }
  .board-wrap {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(61, 220, 90, 0.08), inset 0 0 24px rgba(0, 0, 0, 0.6);
    background: var(--panel);
  }
  canvas { display: block; border-radius: 6px; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(7, 12, 8, 0.82);
    border-radius: 6px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    color: var(--snake);
    font-size: 30px;
    letter-spacing: 0.3em;
    text-shadow: 0 0 18px rgba(61, 220, 90, 0.55);
    text-wrap: balance;
  }
  .overlay p { color: var(--dim); font-size: 13px; line-height: 1.7; }
  .overlay .final { color: var(--text); font-size: 15px; }
  .overlay button {
    margin-top: 6px;
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ground);
    background: var(--snake);
    border: none;
    border-radius: 4px;
    padding: 11px 26px;
    cursor: pointer;
    box-shadow: 0 0 22px rgba(61, 220, 90, 0.35);
  }
  .overlay button:hover { background: var(--food); }
  .overlay button:focus-visible { outline: 2px solid var(--food); outline-offset: 3px; }
  .hint { text-align: center; color: var(--dim); font-size: 11px; letter-spacing: 0.12em; }
  .badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    opacity: 0.45;
  }
  .badge.earned {
    color: var(--snake);
    border-color: var(--snake-dim);
    opacity: 1;
    box-shadow: 0 0 12px rgba(61, 220, 90, 0.18);
  }
  .toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: var(--ground);
    border: 1px solid var(--snake-dim);
    color: var(--food);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 8px 18px;
    box-shadow: 0 0 24px rgba(168, 255, 96, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }
</style>

<div class="game">
  <div class="hud">
    <span class="title">SNAKE</span>
    <span class="scores">
      <span>SCORE<b id="score">0</b></span>
      <span>BEST<b id="best">0</b></span>
    </span>
  </div>
  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="overlay">
      <h1 id="ov-title">SNAKE</h1>
      <p id="ov-msg">Arrow keys or WASD to steer. Swipe on mobile. P pauses.<br>Walls wrap around — only biting yourself ends the game.</p>
      <p class="final hidden" id="ov-final"></p>
      <button id="ov-btn">Start</button>
    </div>
  </div>
  <div class="hint">EAT · GROW · DON'T BITE YOURSELF · WALLS WRAP AROUND</div>
  <div class="badges" id="badges"></div>
</div>

<script>
  const COLS = 21, ROWS = 21;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovMsg = document.getElementById('ov-msg');
  const ovFinal = document.getElementById('ov-final');
  const ovBtn = document.getElementById('ov-btn');

  let cell = 24;
  function sizeBoard() {
    const pad = 48;
    const max = Math.min(window.innerWidth - pad, window.innerHeight - 140);
    cell = Math.max(12, Math.floor(max / COLS));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = COLS * cell * dpr;
    canvas.height = ROWS * cell * dpr;
    canvas.style.width = COLS * cell + 'px';
    canvas.style.height = ROWS * cell + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  let snake, dir, nextDir, food, score, best, dead, paused, timer, speed;
  best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  const BADGES = [
    {id: 'hatchling', name: 'Hatchling', icon: '🥚', at: 30},
    {id: 'garden',    name: 'Garden Snake', icon: '🐍', at: 80},
    {id: 'viper',     name: 'Viper', icon: '⚡', at: 150},
    {id: 'cobra',     name: 'King Cobra', icon: '👑', at: 250},
    {id: 'anaconda',  name: 'Anaconda', icon: '🏆', at: 400},
  ];
  const badgesEl = document.getElementById('badges');
  const toastEl = document.getElementById('toast');
  let earned = new Set(JSON.parse(localStorage.getItem('snake-badges') || '[]'));
  let toastTimer;

  function renderBadges() {
    badgesEl.innerHTML = '';
    BADGES.forEach(b => {
      const el = document.createElement('span');
      el.className = 'badge' + (earned.has(b.id) ? ' earned' : '');
      el.title = 'Reach ' + b.at + ' points';
      el.textContent = b.icon + ' ' + b.name + ' · ' + b.at;
      badgesEl.appendChild(el);
    });
  }

  function checkBadges() {
    BADGES.forEach(b => {
      if (score >= b.at && !earned.has(b.id)) {
        earned.add(b.id);
        localStorage.setItem('snake-badges', JSON.stringify([...earned]));
        renderBadges();
        toastEl.textContent = b.icon + ' ' + b.name + ' unlocked';
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
      }
    });
  }

  function rankFor(points) {
    let r = null;
    BADGES.forEach(b => { if (points >= b.at) r = b; });
    return r;
  }

  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [{x: cx - 1, y: cy}, {x: cx - 2, y: cy}, {x: cx - 3, y: cy}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    speed = 140;
    dead = false;
    paused = false;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    do {
      food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function step() {
    dir = nextDir;
    const head = {
      x: (snake[0].x + dir.x + COLS) % COLS,
      y: (snake[0].y + dir.y + ROWS) % ROWS
    };
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      checkBadges();
      speed = Math.max(65, speed - 3);
      placeFood();
      restartTimer();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    const css = getComputedStyle(document.documentElement);
    ctx.fillStyle = css.getPropertyValue('--panel');
    ctx.fillRect(0, 0, COLS * cell, ROWS * cell);

    ctx.strokeStyle = css.getPropertyValue('--line');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) { ctx.moveTo(i * cell + 0.5, 0); ctx.lineTo(i * cell + 0.5, ROWS * cell); }
    for (let j = 1; j < ROWS; j++) { ctx.moveTo(0, j * cell + 0.5); ctx.lineTo(COLS * cell, j * cell + 0.5); }
    ctx.stroke();

    const g = cell * 0.12;
    ctx.save();
    ctx.shadowColor = 'rgba(168, 255, 96, 0.8)';
    ctx.shadowBlur = cell * 0.6;
    ctx.fillStyle = css.getPropertyValue('--food');
    const fr = cell / 2 - g;
    ctx.beginPath();
    ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, fr, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? css.getPropertyValue('--food') : (i % 2 ? css.getPropertyValue('--snake-dim') : css.getPropertyValue('--snake'));
      const r = Math.max(2, cell * 0.18);
      const x = s.x * cell + g / 2, y = s.y * cell + g / 2, w = cell - g;
      ctx.beginPath();
      ctx.roundRect(x, y, w, w, r);
      ctx.fill();
    });
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(step, speed);
  }

  function start() {
    reset();
    overlay.classList.add('hidden');
    draw();
    restartTimer();
  }

  function gameOver() {
    dead = true;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', best);
      bestEl.textContent = best;
    }
    ovTitle.textContent = 'GAME OVER';
    ovMsg.classList.add('hidden');
    ovFinal.classList.remove('hidden');
    const rank = rankFor(score);
    ovFinal.textContent = 'SCORE ' + score +
      (rank ? ' · ' + rank.icon + ' ' + rank.name.toUpperCase() : '') +
      (score === best && score > 0 ? ' · NEW BEST' : '');
    ovBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (dead || !overlay.classList.contains('hidden') && !paused) return;
    paused = !paused;
    if (paused) {
      clearInterval(timer);
      ovTitle.textContent = 'PAUSED';
      ovMsg.classList.add('hidden');
      ovFinal.classList.add('hidden');
      ovBtn.textContent = 'Resume';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      restartTimer();
    }
  }

  function turn(x, y) {
    if (x === -dir.x && y === -dir.y) return;
    nextDir = {x, y};
  }

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') { e.preventDefault(); turn(0, -1); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { e.preventDefault(); turn(0, 1); }
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); turn(-1, 0); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); turn(1, 0); }
    else if (k === 'p' || k === 'P') togglePause();
    else if ((k === 'Enter' || k === ' ') && !overlay.classList.contains('hidden')) { e.preventDefault(); ovBtn.click(); }
  });

  let touchStart = null;
  document.addEventListener('touchstart', e => {
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive: true});
  document.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  }, {passive: true});

  ovBtn.addEventListener('click', () => {
    if (paused) togglePause();
    else start();
  });

  window.addEventListener('resize', () => { sizeBoard(); draw(); });

  sizeBoard();
  reset();
  renderBadges();
  draw();
</script>
